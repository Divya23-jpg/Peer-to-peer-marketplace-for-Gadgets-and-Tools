<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/listing.css">
    <script src="https://kit.fontawesome.com/97ebdf5864.js" crossorigin="anonymous"></script>
    <title>Listing Items</title>
</head>
<body>
<header>
    <!-- header -->
</header>
    <div>
<form class="listing-form" action="/listings" method="POST" enctype="multipart/form-data">
  <label>Item Title</label>
  <input type="text" name="title" required>

  <label>Description</label>
  <textarea name="description" required></textarea>

  <label>Category</label>
  <input type="text" name="category">

  <label>Daily Rate (₹)</label>
  <input type="number" step="0.01" name="daily_rate" required>

  <label>Upload Photos (max 3)</label>
  <input type="file" name="photos" accept="image/*" multiple required>

  <label>Available From</label>
  <input type="date" name="start_date" required>

  <label>Available Until</label>
  <input type="date" name="end_date" required>

  <button type="submit">Create Listing</button>
</form>

<div>
</body>
</html>
