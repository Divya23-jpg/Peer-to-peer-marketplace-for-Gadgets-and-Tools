<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - GearShare</title>
  <link rel="stylesheet" href="css/signup.css">
  <script src="https://kit.fontawesome.com/97ebdf5864.js" crossorigin="anonymous"></script>
</head>

<body>

    <header>
        <!-- Navbar -->
    </header>
  <div class="hero">
    <div class="hero-text">

  
      
    </div>
    
  <div class="main">
  <h2>Join GearShare</h2>
  <form>

    <label class="name-label">Full Name <i class="fa-solid fa-user"></i></label>
    <input class="name" type="text" placeholder="Enter Your Full Name" required>

    <label class="email-label">Email <i class="fa-solid fa-envelope"></i></label>
    <input class="email" type="email" placeholder="Enter Your Email" required>

    <label class="phone-label">Phone <i class="fa-solid fa-phone"></i></label>
    <input class="phone" type="tel" placeholder="Enter Your Phone Number" required>

    <label class="address-label">Address <i class="fa-solid fa-location-dot"></i></label>
    <input class="address" type="text" placeholder="Enter Your Address" required>

    <label class="password-label">Password <i class="fa-solid fa-lock"></i></label>
    <input class="password" type="password" placeholder="Create a Password" required>

    <label class="confirm-label">Confirm Password <i class="fa-solid fa-lock"></i></label>
    <input class="confirm" type="password" placeholder="Re-enter Password" required>

    <div class="terms">
      <label for="terms">I agree to the Terms & Conditions</label>
      <input type="checkbox" id="terms" required>
    </div>

    <button class="btn">Sign Up</button>
    <p class="login-text">Already have an account? <a href="Login.html">Login</a></p>
  </form>
</div>

  </div>
</body>
</html>
