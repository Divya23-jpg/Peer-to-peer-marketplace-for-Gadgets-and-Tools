<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Sign Up - GearShare</title>
  <link rel="stylesheet" href="css/signup_renter.css">
  <script src="https://kit.fontawesome.com/97ebdf5864.js" crossorigin="anonymous"></script>
</head>

<body>
  <header>
    <!-- Navbar will go here -->
  </header>

  <div class="hero">
    <div class="main">
      <h2>Renter Sign Up</h2>
      <form action="/signup/renter" method="POST">
        <label class="name-label">Business / Full Name <i class="fa-solid fa-user"></i></label>
        <input class="name" type="text"   name="business_name" placeholder="Enter Your Business or Name" required>

        <label class="email-label">Email <i class="fa-solid fa-envelope"></i></label>
        <input class="email" type="email"     name="email" placeholder="Enter Your Email" required>

        <label class="phone-label">Phone <i class="fa-solid fa-phone"></i></label>
        <input class="phone" type="tel"    name="phone" placeholder="Enter Your Phone Number" required>

        <label class="address-label">Address <i class="fa-solid fa-location-dot"></i></label>
        <input class="address" type="text"   name="address"  placeholder="Enter Your Address" required>

        <label class="bank-label">Bank Account / UPI <i class="fa-solid fa-credit-card"></i></label>
        <input class="bank" type="text"     name="bank_account" placeholder="Enter Bank Account or UPI ID" required>

      

        <label class="id-label">ID Verification <i class="fa-solid fa-id-card"></i></label>
        <input class="id" type="file"   name="id_verification"  accept=".jpg,.png,.pdf" required>

        <label class="password-label">Password <i class="fa-solid fa-lock"></i></label>
        <input class="password" type="password"   name="password"   placeholder="Create a Password" required>

        <label class="confirm-label">Confirm Password <i class="fa-solid fa-lock"></i></label>
        <input class="confirm" type="password" name="confirmPassword" placeholder="Re-enter Password" required>

        <div class="terms">
          <label for="terms">I agree to the Terms & Conditions</label>
          <input type="checkbox" id="terms" required>
        </div>

        <button class="btn">Sign Up</button>
        <p class="login-text">Already have an account? <a href="Login.html">Login</a></p>
      </form>
    </div>
  </div>
</body>
</html>
