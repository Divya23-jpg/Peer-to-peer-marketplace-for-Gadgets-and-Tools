<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/Login.css">
    <script src="https://kit.fontawesome.com/97ebdf5864.js" crossorigin="anonymous"></script>


</head>
<body>
<div class="hero">
    <div class="hero-text">
        <h2 class="welcone">Welcome  to GearShare</h2>
        <p class="upper-line">Login to rent or share gear with ease</p>
    </div>


    <div class="main">
        <div class="f">
        <form >
                <!-- <div class="form-group"> -->
                <label class="email-label">Email <i  class="fa-solid fa-envelope"></i></label>
                <input  class="email"    type="email"  placeholder="Enter Your Email"  required>
                <!-- </div> -->
         
                <!-- <div class="form-group"></div> -->
                <label  class="password-label" for="">Password <i  id="lock"  class="fa-solid fa-lock"></i> </label>
                <input  class="password"  type="password" placeholder="Enter Your Password "    required>
                <!-- </div> -->

                <!-- <div class="remeber"> -->
                <div class="remember">
                    <label for="remember">Remember Me</label>
                    <input  type="checkbox" id="remember" >
                </div>
                
                <!-- </div> -->
                <button class="btn">Login</button>
                <p  class="signup-text">Don't have an account??<a href="#">SignUp</a></p>
        </form>
        </div>
    </div>
</div>
</body>
</html>
